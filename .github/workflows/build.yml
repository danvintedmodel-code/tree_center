name: Compilar

# Compila Tree Center en un Mac de GitHub en cada push, para no depender de estar
# sentado delante del Mac. Si algo no compila, sale aqui con el archivo y la linea.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS
    # macos-14 se intento (para tener Xcode 15, el del Mac de desarrollo) y la
    # etiqueta ya no existe: el job se cancelo en un segundo sin asignar maquina.
    # Asi que la imagen de serie, y el Xcode 15 solo si resulta que lo trae.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # El Mac de desarrollo es un MacBook Pro de 2017 con Ventura 13.7, y ahi el
      # Xcode mas nuevo que entra es el 15.2. Lo ideal seria compilar con ese
      # mismo, y si la imagen lo trae se usa.
      #
      # Si no lo trae, el riesgo real es menor de lo que parece: `Package.swift`
      # declara `.iOS(.v17)`, asi que usar una API posterior a iOS 17.0 sin
      # `if #available` no compila ni con el Xcode mas nuevo. Lo que un Xcode
      # nuevo no puede cazar es sintaxis de Swift posterior a la 5.9, y eso se
      # vigila a mano.
      - name: Usar un Xcode 15
        run: |
          ls -d /Applications/Xcode*.app || true
          LIST=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V || true)
          PICK=$(echo "$LIST" | grep -E 'Xcode_15(\.0(\.[0-9]+)?|\.1|\.2)?\.app$' | head -1)
          if [ -z "$PICK" ]; then
            PICK=$(echo "$LIST" | head -1)
          fi
          if [ -z "$PICK" ]; then
            echo "::warning::No hay ningun Xcode 15 en esta imagen. Se compila con el de serie, que es mas nuevo que el del Mac de desarrollo: un verde aqui no promete un verde alli."
          else
            echo "Elegido: $PICK"
            sudo xcode-select -s "$PICK/Contents/Developer"
          fi

      - name: Que Xcode ha tocado
        run: xcodebuild -version

      # Queda en el log a proposito: los nombres de esquema de un paquete no son
      # los que uno supone, y haberlos impresos ahorra un viaje entero.
      - name: Esquemas del paquete
        run: xcodebuild -list

      - name: Compilar la app para iOS
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme TreeCenterKit \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      # El nombre del simulador cambia con cada imagen de GitHub, asi que se busca
      # uno que exista en vez de dejarlo escrito a mano y que falle dentro de un mes.
      - name: Elegir simulador
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*' | sed 's/[[:space:]]*$//' || true)
          if [ -z "$DEVICE" ]; then
            echo "No hay ningun simulador de iPhone en esta maquina:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Simulador: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Probar la logica del trazo
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme TreeCenter-Package \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO
