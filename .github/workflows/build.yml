name: Compilar

# Compila Tree Center en un Mac de GitHub en cada push, para no depender de estar
# sentado delante del Mac. Si algo no compila, sale aqui con el archivo y la linea.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Que Xcode ha tocado
        run: xcodebuild -version

      # Queda en el log a proposito: los nombres de esquema de un paquete no son
      # los que uno supone, y haberlos impresos ahorra un viaje entero.
      - name: Esquemas del paquete
        run: xcodebuild -list

      - name: Compilar la app para iOS
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme TreeCenterKit \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      # El nombre del simulador cambia con cada imagen de GitHub, asi que se busca
      # uno que exista en vez de dejarlo escrito a mano y que falle dentro de un mes.
      - name: Elegir simulador
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*' | sed 's/[[:space:]]*$//' || true)
          if [ -z "$DEVICE" ]; then
            echo "No hay ningun simulador de iPhone en esta maquina:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Simulador: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Probar la logica del trazo
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme TreeCenter-Package \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO
